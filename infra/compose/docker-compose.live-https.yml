# Standalone HTTPS edge for any runner vendor. Bind the runner HTTP port to
# a private interface/firewall; the edge exposes HLS and grant-authenticated
# stream-key/status routes, never broker session management.
services:
  live_hls_https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      LIVE_HLS_HOST: ${LIVE_HLS_HOST:-localhost}
      LIVE_HLS_UPSTREAM: ${LIVE_HLS_UPSTREAM:-host.docker.internal:8088}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${LIVE_HLS_HTTP_PORT:-80}:80"
      - "${LIVE_HLS_HTTPS_PORT:-443}:443"
    volumes:
      - ../proxy/Caddyfile.live:/etc/caddy/Caddyfile:ro
      - live_hls_certs:/data
      - live_hls_config:/config
volumes:
  live_hls_certs: {}
  live_hls_config: {}
