      STATE_DIR: /var/lib/transcode-runner
    volumes:
    - ../presets:/etc/runner/presets:ro
    - transcode_runner-state:/var/lib/transcode-runner
    ports:
    - ${TRANSCODE_RUNNER_PORT:-8086}:8080
  abr_runner_intel:
    image: ${REGISTRY:-tztcloud}/abr-runner-intel:${TAG:-v2-local}
    profiles:
    - intel
    devices:
    - /dev/dri:/dev/dri
    environment:
      RUNNER_ADDR: :8080
      MAX_QUEUE_SIZE: '2'
